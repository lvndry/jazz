# Dependency updates. Security advisories open PRs as they are published; version updates
# are batched weekly so the queue stays reviewable. Actions are pinned to commit SHAs with the
# tag in a trailing comment, and Dependabot updates both together.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      ai-sdk:
        patterns:
          - "ai"
          - "@ai-sdk/*"
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
      development:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
