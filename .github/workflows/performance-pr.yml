name: Performance (PR lane)

on:
  pull_request:
    paths:
      - "packages/**"
      - "bench/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/performance-pr.yml"

permissions:
  contents: read

concurrency:
  group: performance-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  budgets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check first-turn token budget
        run: bun run bench:first-turn
      - name: Check startup, stream-processor, transcript-rows and release size against absolute budgets
        run: bun run bench:pr --ci
