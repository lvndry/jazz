name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "packages/**"
      - "plugins/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig*"
      - ".prettierrc*"
      - "eslint.config.*"
      - ".eslintrc*"
      - ".github/workflows/ci.yml"
      - "**/*.md"
      - ".markdownlint-cli2.jsonc"
  pull_request:
    paths:
      - "packages/**"
      - "plugins/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig*"
      - ".prettierrc*"
      - "eslint.config.*"
      - ".eslintrc*"
      - ".github/workflows/ci.yml"
      - "**/*.md"
      - ".markdownlint-cli2.jsonc"

permissions:
  contents: read

jobs:
  # Docs-only checks. Gated on markdown changes via dorny/paths-filter, so a typo fix does
  # not drag in the full lint/build, and this job skips in seconds when no .md changed.
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect markdown changes
        uses: dorny/paths-filter@v3
        id: changed
        with:
          filters: |
            markdown:
              - '**/*.md'
              - '.markdownlint-cli2.jsonc'
              - 'scripts/check-docs-links.ts'

      - name: Setup Bun
        if: steps.changed.outputs.markdown == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Lint markdown style
        if: steps.changed.outputs.markdown == 'true'
        run: bunx markdownlint-cli2

      # markdownlint has no rule for relative-link validity (MD051 only checks in-file
      # #anchors), so this catches the breakage markdownlint cannot see.
      - name: Check docs links
        if: steps.changed.outputs.markdown == 'true'
        run: bun run docs:check-links

  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore ESLint cache
        uses: actions/cache@v5
        with:
          path: .eslintcache
          key: ${{ runner.os }}-eslint-${{ hashFiles('bun.lock', 'eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-eslint-${{ hashFiles('bun.lock', 'eslint.config.mjs') }}-

      - name: Lint
        run: bun run lint --no-color

      - name: Typecheck
        run: bun run typecheck

      - name: Typecheck evals
        run: bun run typecheck:evals

      - name: Rebuild reviewed plugin catalog without credentials
        env:
          TYPESAFE_API_KEY: ""
        run: bun run plugin:catalog

      - name: Build
        run: bun run build:binary

      # Building proves it compiles, not that it runs. Asserts on output, not
      # exit status: the crash this exists for printed "Fatal error" and exited 0.
      - name: Smoke-test the compiled binary
        env:
          JAZZ_HOME: ${{ runner.temp }}/jazz-smoke-home
        run: |
          set -euo pipefail
          binary="deploy/binaries/jazz-linux-$(if [ "$(uname -m)" = "x86_64" ]; then echo x64; else echo arm64; fi)"
          version="$(bun --print 'require("./package.json").version')"

          check() {
            expected="$1"
            shift
            printf '  jazz %s\n' "$*"
            output="$("$binary" "$@" 2>&1 || true)"
            if ! printf '%s' "$output" | grep -qF -- "$expected"; then
              printf 'expected %s in the output of `jazz %s`, got:\n%s\n' "$expected" "$*" "$output" >&2
              exit 1
            fi
          }

          check "$version" --version
          check "Usage: jazz" --help
          # Reaches the agent stack, which is what the shipped crash broke.
          check "No agents found" agent list
          # Reads a persona out of the binary's embedded assets.
          check "Personas" persona list

          # Proves a dependency-importing plugin can be pre-bundled once and
          # imported by the standalone binary without node_modules at runtime.
          bun run scripts/plugin-pack.ts scripts/fixtures/plugin-pack/good
          probe="$($binary plugin _probe-artifact scripts/fixtures/plugin-pack/good/release/catalog-entry.json --input scripts/fixtures/plugin-pack/good/input.json)"
          if ! printf '%s' "$probe" | grep -qF -- '"status": "answered"'; then
            printf 'compiled plugin probe failed:\n%s\n' "$probe" >&2
            exit 1
          fi

      # The compiled binary against a scripted model server: a plain answer, a tool call,
      # an approval park (exit 2) and `jazz runs approve`, asserting each envelope.
      - name: End-to-end jazz run against a stub provider
        run: |
          set -euo pipefail
          JAZZ_BIN="$PWD/deploy/binaries/jazz-linux-$(if [ "$(uname -m)" = "x86_64" ]; then echo x64; else echo arm64; fi)" \
            bun run test:e2e

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macOS runs the launchd, Keychain, iMessage and codesign code paths that ship to it.
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck tests
        if: runner.os == 'Linux'
        run: bun run test:typecheck

      - name: Test
        if: runner.os != 'Linux'
        run: bun run test

      # Coverage is reported, not enforced: there is no floor yet.
      - name: Test with coverage
        if: runner.os == 'Linux'
        run: |
          bun test --coverage --coverage-reporter=text --coverage-reporter=lcov 2>&1 | tee test-output.txt
          {
            echo "### Test coverage"
            echo
            echo '```'
            grep -E '^-+\|' -m 1 test-output.txt || true
            grep -E '^ *File +\|' -m 1 test-output.txt || true
            grep -E '^ *All files +\|' -m 1 test-output.txt || echo "No coverage summary was printed."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  # The chat bots deploy with docker compose from these Dockerfiles; build them so a broken
  # image is caught here rather than by the hourly auto-update on a live box. Build only.
  bot-images:
    name: build ${{ matrix.bot }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        bot: [telegram-bot, discord-bot]
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build the image
        run: docker build --file "packages/${{ matrix.bot }}/src/Dockerfile" --tag "jazz-${{ matrix.bot }}:ci" .
