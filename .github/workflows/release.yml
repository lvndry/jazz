name: Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

# Every job that writes uses RELEASE_PAT; GITHUB_TOKEN stays read-only everywhere, including
# the release-notes job, where an auto-approving agent reads untrusted commit text.
permissions:
  contents: read

jobs:
  tag:
    name: Bump version & create tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
      previous_tag: ${{ steps.bump.outputs.previous_tag }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get previous tag
        id: prev_tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
          echo "tag=$PREV_TAG" >> "$GITHUB_OUTPUT"

      - name: Check for commits since last release
        run: |
          COMMIT_COUNT=$(git rev-list ${{ steps.prev_tag.outputs.tag }}..HEAD --count)
          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "No commits since ${{ steps.prev_tag.outputs.tag }}, nothing to release."
            exit 1
          fi
          echo "$COMMIT_COUNT commit(s) since ${{ steps.prev_tag.outputs.tag }}"

      - name: Bump version
        id: bump
        run: |
          npm version ${{ inputs.version_type }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          NEW_TAG="v${NEW_VERSION}"
          git add package.json
          git commit -m "${NEW_VERSION}"
          git tag -a "${NEW_TAG}" -m "${NEW_TAG}"
          git push origin main --follow-tags
          echo "new_tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${{ steps.prev_tag.outputs.tag }}" >> "$GITHUB_OUTPUT"

  notes:
    name: Generate release notes
    needs: tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      body: ${{ steps.extract.outputs.body }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.new_tag }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install Jazz
        run: bun install -g jazz-ai --trust

      - name: Setup Jazz agent and workflow
        env:
          NEW_TAG: ${{ needs.tag.outputs.new_tag }}
          PREVIOUS_TAG: ${{ needs.tag.outputs.previous_tag }}
          REPO: ${{ github.repository }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          mkdir -p "$HOME/.jazz/agents" workflows/release-notes
          cp .github/jazz/agents/release-notes.json "$HOME/.jazz/agents/"
          sed -e "s/__NEW_TAG__/$NEW_TAG/g" -e "s/__PREVIOUS_TAG__/$PREVIOUS_TAG/g" -e "s|__REPO__|$REPO|g" -e "s|__WORKSPACE__|$WORKSPACE|g" \
            .github/jazz/workflows/release-notes/WORKFLOW.md > workflows/release-notes/WORKFLOW.md
          echo "--- Substituted workflow ---"
          cat workflows/release-notes/WORKFLOW.md

      # The workflow's own policy (autoApprove: read-only plus its git allowlist) is what
      # --auto-approve applies. A failed run is not fatal: the publish job falls back to
      # GitHub's generated notes.
      - name: Generate release notes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CI: "true"
          JAZZ_DISABLE_CATCH_UP: "1"
          JAZZ_MAX_COST_USD: "2"
        run: |
          set +e -o pipefail
          jazz workflow run release-notes --auto-approve --agent release-notes \
            --max-cost-usd "$JAZZ_MAX_COST_USD" --json --events tools | tee /tmp/jazz-release-notes.txt
          echo "${PIPESTATUS[0]}" > /tmp/jazz-release-notes-exit

      - name: Extract release notes
        id: extract
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { readRunOutcome, describeFailure } = require('./.github/jazz/scripts/run-outcome.cjs');
            const outcome = readRunOutcome('/tmp/jazz-release-notes.txt', '/tmp/jazz-release-notes-exit');
            if (outcome.kind !== 'answered') {
              const notice = describeFailure(outcome, `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`, 'Release notes');
              core.warning(`${notice} Falling back to GitHub's generated notes.`);
              await core.summary.addHeading('Release notes', 2).addRaw(notice, true).write();
              core.setOutput('body', '');
              return;
            }

            // Prefer the agent's four-backtick fence; fall back to a
            // last-occurrence scan of the three-backtick form so inner
            // code samples don't truncate the wrapper.
            const extractFencedMarkdown = (text) => {
              const fourFence = text.match(/````markdown\s*\n([\s\S]*?)\n?````/);
              if (fourFence) return fourFence[1].trim();

              const open = text.lastIndexOf('```markdown');
              if (open < 0) return null;
              const after = text.slice(open + '```markdown'.length);
              const close = after.lastIndexOf('```');
              if (close < 0) return null;
              return after.slice(0, close).trim();
            };

            core.setOutput('body', extractFencedMarkdown(outcome.answer) ?? '');

  release:
    name: Create release
    needs: [tag, notes]
    if: always() && needs.tag.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create GitHub release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          NOTES_BODY: ${{ needs.notes.outputs.body }}
          NEW_TAG: ${{ needs.tag.outputs.new_tag }}
          PREVIOUS_TAG: ${{ needs.tag.outputs.previous_tag }}
        with:
          github-token: ${{ secrets.RELEASE_PAT }}
          script: |
            const tag = process.env.NEW_TAG;
            let releaseBody = process.env.NOTES_BODY;

            if (!releaseBody) {
              console.log('Jazz release notes unavailable, falling back to GitHub auto-generated notes.');
              const generated = await github.rest.repos.generateReleaseNotes({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                previous_tag_name: process.env.PREVIOUS_TAG,
              });
              releaseBody = generated.data.body || '_Release notes could not be generated. See commit history for changes._';
            }

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              body: releaseBody,
              draft: false,
              prerelease: false
            });

            console.log(`Release ${tag} created successfully.`);
