name: website

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "packages/website/**"
      - "docs/**"
      - "packages/cli/src/ui/theme.ts"
      - "packages/cli/src/ui/glyphs.ts"
      - "packages/adapters/src/plugins/**"
      - "packages/plugin-sdk/**"
      - "plugins/**"
      - "skills/**"
      - "scripts/build-plugin-catalog.ts"
      - ".github/workflows/website.yml"
  push:
    branches: [main]
    paths:
      - "packages/website/**"
      - "docs/**"
      - "packages/cli/src/ui/theme.ts"
      - "packages/cli/src/ui/glyphs.ts"
      - "packages/adapters/src/plugins/**"
      - "packages/plugin-sdk/**"
      - "plugins/**"
      - "skills/**"
      - "scripts/build-plugin-catalog.ts"
      - ".github/workflows/website.yml"
  workflow_dispatch:

# One deployment at a time, and one in progress is never cancelled halfway, so
# lvndry.github.io/jazz is always one whole build.
concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Cache bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generated tokens are fresh
        run: |
          bun run tokens
          git diff --exit-code src/styles/tokens.css src/generated/tokens.ts
        working-directory: packages/website
      - name: Build
        run: bun run build
        working-directory: packages/website
      - name: Check internal links
        run: bun run check-links
        working-directory: packages/website
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Upload the site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/website/dist

  deploy:
    name: Deploy to GitHub Pages
    # Only main publishes. A manual run on another branch builds and checks it, and stops there.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
