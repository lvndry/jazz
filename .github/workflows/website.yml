name: website

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "packages/website/**"
      - "docs/**"
      - "packages/cli/src/ui/theme.ts"
      - "packages/cli/src/ui/glyphs.ts"
      - "packages/adapters/src/plugins/**"
      - "packages/plugin-sdk/**"
      - "plugins/**"
      - "scripts/build-plugin-catalog.ts"
      - ".github/workflows/website.yml"
  push:
    branches: [main]
    paths:
      - "packages/website/**"
      - "docs/**"
      - "packages/cli/src/ui/theme.ts"
      - "packages/cli/src/ui/glyphs.ts"
      - "packages/adapters/src/plugins/**"
      - "packages/plugin-sdk/**"
      - "plugins/**"
      - "scripts/build-plugin-catalog.ts"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Cache bun downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generated tokens are fresh
        run: |
          bun run tokens
          git diff --exit-code src/styles/tokens.css src/generated/tokens.ts
        working-directory: packages/website
      - name: Build
        run: bun run build
        working-directory: packages/website
      - name: Check internal links
        run: bun run check-links
        working-directory: packages/website
