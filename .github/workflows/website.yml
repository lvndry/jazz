name: website

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "packages/website/**"
      - "docs/**"
      - "packages/cli/src/ui/theme.ts"
      - "packages/cli/src/ui/glyphs.ts"
      - ".github/workflows/website.yml"
  push:
    branches: [main]
    paths:
      - "packages/website/**"
      - "docs/**"
      - "packages/cli/src/ui/theme.ts"
      - "packages/cli/src/ui/glyphs.ts"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Cache bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # packages/website is a workspace member now, so one install at the root
      # sets up every package, including it — no separate lockfile to sync.
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generated tokens are fresh
        run: |
          bun run tokens
          git diff --exit-code src/styles/tokens.css src/generated/tokens.ts
        working-directory: packages/website
      - name: Build
        run: bun run build
        working-directory: packages/website
      - name: Check internal links
        run: bun run check-links
        working-directory: packages/website
